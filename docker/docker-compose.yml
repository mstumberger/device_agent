services:
  # MQTT Broker (Eclipse Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: cybergrid-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./deployment/mosquitto/config:/mosquitto/config
      - ./deployment/mosquitto/data:/mosquitto/data
      - ./deployment/mosquitto/log:/mosquitto/log
    networks:
      - cybergrid-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3", "-u", "cybergrid", "-P", "cybergrid"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CyberGrid Device Agent
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cybergrid-agent
    restart: unless-stopped
    volumes:
      - ../config.yaml:/app/config.yaml
      - ../device.json:/app/device.json
    environment:
      - LOG_LEVEL=INFO
    networks:
      - cybergrid-network
    depends_on:
      mqtt:
        condition: service_healthy

networks:
  cybergrid-network:
    driver: bridge
    name: cybergrid-network
